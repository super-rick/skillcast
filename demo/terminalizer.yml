# Terminalizer config for SkillCast demo
# Record: terminalizer record demo/skillcast
# Render:  terminalizer render demo/skillcast

command: bash demo/demo.sh
cwd: null
env:
  recording: true
cols: 80
rows: 30
repeat: 0
quality: 100
frameDelay: auto
maxIdleTime: 2000
frameBox:
  type: solid
  title: SkillCast Demo
  style: []
watermark:
  imagePath: null
  style: []
cursorStyle: block
fontFamily: Monaco, Lucida Console, Ubuntu Mono, Monospace
fontSize: 14
lineHeight: 1
letterSpacing: 0
theme:
  background: transparent
  foreground: "#afafaf"
